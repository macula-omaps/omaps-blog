baseURL = "https://blog.omaps.cn/"
title = "麦扑科技 OMAPS"
theme = "roadster"

defaultContentLanguage = "zh-cn"
locale = "zh-cn"
hasCJKLanguage = true

enableRobotsTXT = true
enableGitInfo = false

[pagination]
  pagerSize = 10

[taxonomies]
  category = "categories"
  tag = "tags"

[permalinks]
  [permalinks.term]
    tags = "/tags/:slug/"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    style = "monokai"
    lineNos = false

[languages]
  [languages.zh-cn]
    label = "中文"
    weight = 1
    title = "麦扑科技 OMAPS"
    [languages.zh-cn.params]
      description = "麦扑科技（OMAPS）团队技术博客：点位管理系统、多租户中台、API 治理与工程实践。"
  [languages.en]
    label = "English"
    weight = 2
    title = "OMAPS Tech Blog"
    [languages.en.params]
      description = "OMAPS team engineering blog: outdoor-advertising spot management, multi-tenant platform, API governance and engineering practice."
    [languages.en.menu]
      [[languages.en.menu.main]]
        name = "Home"
        url = "/"
        weight = 10
      [[languages.en.menu.main]]
        name = "Posts"
        url = "/post/"
        weight = 20
      [[languages.en.menu.main]]
        name = "About"
        url = "/about/"
        weight = 30
      [[languages.en.menu.main]]
        name = "Website"
        url = "https://www.omaps.cn"
        weight = 40
      [[languages.en.menu.footer]]
        name = "Website www.omaps.cn"
        url = "https://www.omaps.cn"
        weight = 10
      [[languages.en.menu.footer]]
        name = "GitHub"
        url = "https://github.com/macula-omaps"
        weight = 20

[params]
  description = "麦扑科技（OMAPS）团队技术博客：点位管理系统、多租户中台、API 治理与工程实践。"
  copyright = "麦扑科技（OMAPS）"
  opengraph = true
  twitter_cards = false
  readmore = true
  authorbox = false
  pager = true
  post_meta = ["date", "categories", "wordcount", "pageview"]
  mainSections = ["post"]
  # 目录站级默认开启；侧栏模板对无标题文章有保护（TableOfContents 长度 > 32 才渲染）
  toc = true
  # 品牌图标（取自 omaps-web/public，与产品端一致）；favicon.ico 由主题模板引用，
  # SVG / apple-touch-icon 在这里补挂
  CustomHeadHTML = '''
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
'''
  # 百度统计：沿用官网 www.omaps.cn 的站点 id（用户决定，两站数据合并统计）。
  # 留空则不输出任何统计脚本；本地 hugo server 预览也自动不输出。
  baiduTongjiId = "91d1ed7b8e9f57cc6d6af12e7feed6ed"
  # Google Fonts 已在 layouts/_partials/head/gfonts.html 中整体关闭
  # 站点级样式补充；?v=N 用于改样式后强制浏览器刷新缓存（每次改 omaps.css 时递增）
  customCSS = []
  dateFormat = "2006-01-02"

  [params.logo]
    subtitle = "AI 原生研发与工程实践"

  # Waline 评论与浏览量（自托管于公司服务器 waline.omaps.cn，nginx 反代 omaps-waline 容器）。
  # 客户端 JS/CSS 自托管在 static/waline/；服务端部署与运维见 omaps-deploy 仓库 docs/waline.md。
  [params.waline]
    serverURL = "https://waline.omaps.cn"

  # 字体与品牌色（官网主色 #ff8000，正文链接受对比度约束取深一档）
  [params.style.vars]
    fontFamilyPrimary = '"PingFang SC","Hiragino Sans GB","Microsoft YaHei",-apple-system,"Segoe UI",Helvetica,Arial,sans-serif'
    highlightColor = "#d96f00"

  [params.sidebar]
    home = "right"
    list = "right"
    single = "right"
    widgets = ["recent", "categories", "taglist"]

  [params.widgets]
    recent_num = 5
    tags_counter = false

[[menus.main]]
  name = "首页"
  url = "/"
  weight = 10

[[menus.main]]
  name = "文章"
  url = "/post/"
  weight = 20

[[menus.main]]
  name = "关于"
  url = "/about/"
  weight = 30

[[menus.main]]
  name = "官网"
  url = "https://www.omaps.cn"
  weight = 40





[[menus.footer]]
  name = "官网 www.omaps.cn"
  url = "https://www.omaps.cn"
  weight = 10

[[menus.footer]]
  name = "GitHub"
  url = "https://github.com/macula-omaps"
  weight = 20


